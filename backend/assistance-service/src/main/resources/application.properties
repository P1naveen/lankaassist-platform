spring.application.name=assistance-service
server.port=8086

# MySQL connection
spring.datasource.url=jdbc:mysql://localhost:3306/lankaassist_assistance?useSSL=false&serverTimezone=UTC
spring.datasource.username=${LANKAASSIST_DB_USERNAME:lankaassist_user}
spring.datasource.password=${LANKAASSIST_DB_PASSWORD}

# JPA and Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
