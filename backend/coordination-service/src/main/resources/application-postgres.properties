# Coordination Service PostgreSQL connection
spring.datasource.url=jdbc:postgresql://localhost:5432/lankaassist_coordination
spring.datasource.username=lankaassist_user
spring.datasource.password=${LANKAASSIST_PG_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
