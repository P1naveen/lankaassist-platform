# Coordination Service PostgreSQL connection
spring.datasource.url=jdbc:postgresql://localhost:5432/lankaassist_coordination
spring.datasource.username=lankaassist_user
spring.datasource.password=${LANKAASSIST_PG_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Ignore possible old MySQL SQL scripts
spring.sql.init.mode=never
