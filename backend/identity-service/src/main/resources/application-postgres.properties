# PostgreSQL connection for Identity Service
spring.datasource.url=jdbc:postgresql://localhost:5432/lankaassist_identity
spring.datasource.username=lankaassist_user
spring.datasource.password=${LANKAASSIST_PG_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Do not initialize old MySQL-specific SQL scripts
spring.sql.init.mode=never
